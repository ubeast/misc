# A grab-bag of independent single-file tools, one per directory under tools/.
# Nothing is installable and there are no runtime dependencies -- each tool is a
# standalone .py file. pyproject.toml exists only to pin the test tooling and
# configure pytest across every tool's tests/ directory.

[project]
name = "misc-tools"
version = "0.1.0"
description = "Independent single-file tools (see README.md for the index)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tools"]
