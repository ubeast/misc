# This project is a single script: scripts/ic_filename_parser.py (stdlib only).
# There is no installable package and no runtime dependencies -- pyproject.toml
# exists only to pin the test tooling and configure pytest.

[project]
name = "ic-filename-parser"
version = "0.2.0"
description = "Parse EBSO/DLMS/DTEB Interface Change (IC) PDF filenames into a table."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
