[project]
name = "ic-filename-parser"
version = "0.1.0"
description = "Parse EBSO/DLMS/DTEB Interface Change (IC) PDF filenames into a structured table."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
ic-filename-parser = "ic_filename_parser.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ic_filename_parser"]

[tool.pytest.ini_options]
testpaths = ["tests"]
